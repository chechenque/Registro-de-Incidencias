[project]
name = "registro-incidencias"
version = "0.1.0"
description = "Aplicación web para registrar y dar seguimiento a incidencias"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "email-validator>=2.3.0",
    "flask>=3.1.3",
    "flask-login>=0.6.3",
    "flask-sqlalchemy>=3.1.1",
    "flask-wtf>=1.3.0",
    "requests>=2.32.5",
]

[project.scripts]
registro-incidencias = "registro_incidencias:main"

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
